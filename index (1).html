 const w=WP[tool]||WP.sh;let pts=draft.slice();
 for(let it=0;it<3;it++)pts=pts.map((p,i)=>i==0||i==pts.length-1?p:[(pts[i-1][0]+p[0]*2+pts[i+1][0])/4,(pts[i-1][1]+p[1]*2+pts[i+1][1])/4]);

 drawIcon(ic,tool,shColor);if(tool=="veh"&&vehFlag)flagG(g,vehFlag,.6,0,-24);

 const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));const L=cum[cum.length-1];
 const s={pts,g,ic,tr,cum,dist:0,w,k:stat?0:w.k,lv:shLevel,orig:{},trail:[],key:null,seen:new Set(),cur:null,kill:(shootOn&&w.kill&&!stat&&Math.random()<.7)?L*(.15+.75*Math.random()):Infinity,pos:pts[0].slice(),head:Math.atan2(pts[1][1]-pts[0][1],pts[1][0]-pts[0][0])*180/Math.PI};

 notify(w.nm,(stat?"над ":"курсом на ")+nameOf(id)+(id=="kc"||id=="cr"?"":" обл."))}}
let last=performance.now();
function loop(t){const dt=Math.min(.1,(t-last)/1000);last=t;aiUpdate(dt);
 shs.forEach(s=>{s.dist+=SPD*(SPD<5&&s.w.rk&&s.k?s.w.rk:s.k)*dt;const L=s.cum[s.cum.length-1];if(s.dist>=L||s.dist>=s.kill){if(s.dist<L)boom(s);else if(s.w.nuke)explodeNuke(s.pos);else if(s.w.fx2)fx(s.w.fx2,s.pos);leave(s);s.g.remove();s.tr.remove();shs.splice(shs.indexOf(s),1);return}
  let i=1;while(s.cum[i]<s.dist)i++;const a=s.pts[i-1],b=s.pts[i],f=(s.dist-s.cum[i-1])/(s.cum[i]-s.cum[i-1]||1);

   const dk=distOn?distAt(s.pos,oid_):null,key=dk!==null?"d"+dk:"o"+oid_;
   if(key!==s.key){s.key=key;hold_(s,key);s.trail=s.trail.filter(x=>x!==key);s.trail.push(key);const W=distOn?22:4;while(s.trail.length>W)rel(s,s.trail.shift())}}
  const tg=Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI;let df=((tg-s.head+540)%360)-180;if(s.dist<1)df=0,s.head=tg;s.head+=df*Math.min(1,dt*5);
  s.ic.setAttribute("transform",`rotate(${s.w.fx?0:s.head})`);

  s.tr.setAttribute("points",[s.pos,...s.pts.slice(i)].map(p=>p.join(",")).join(" "))});

  if(c.width!==Math.round(rc.width*dpr)||c.height!==Math.round(rc.height*dpr)){c.width=Math.round(rc.width*dpr);c.height=Math.round(rc.height*dpr)}
  const dt=Math.min(.05,(now-last)/1000);last=now;const W=c.width,H=c.height;x.clearRect(0,0,W,H);
  F.forEach(f=>{f.y+=f.v*dt;f.d+=dt*.9;f.x+=Math.sin(f.d)*.0005;if(f.y>1){f.y=-.02;f.x=Math.random()}x.globalAlpha=f.a;x.fillStyle="#7d95ab";x.beginPath();x.arc(f.x*W,f.y*H,f.r*dpr,0,6.2832);x.fill()});

const AIN={easy:"Лёгкий",mid:"Средний",hard:"Сложный"};
const AILV={easy:{min:4,max:7,n:1,spd:1},mid:{min:2.5,max:5,n:1,spd:1.2},hard:{min:1.5,max:3,n:2,spd:1.5}};
let aiLevel="mid",aiInf=false,refillCd=0;
function savePrefAI(){if(!prof)return;prof.ai={level:aiLevel,inf:aiInf};saveProf()}
function refill(){if(aiInf||refillCd>0)return;ammo=Math.min(ammo+5,20);refillCd=12;notify("Перехватчики пополнены","+5, всего "+ammo);updBbar()}
function clearAll(){shs.forEach(s=>{leave(s);s.g.remove();s.tr.remove()});shs.length=0;icpt.forEach(q=>q.g.remove());icpt.length=0;
 nks.forEach(rmNuke);nks.length=0;fls.forEach(f=>f.g.remove());fls.length=0;Object.keys(regTag).forEach(k=>delete regTag[k]);O.forEach(o=>paint(o[0],null));emgUpdate()}
function updBbar(){const b=$("bp");if(b){b.textContent="P1-SUN · "+(aiInf?"∞":ammo);b.style.outline=tool=="p1"?"2px solid #4c8dff":""}const r=$("bref");if(r){r.textContent=aiInf?"∞":(refillCd>0?"+5 ("+Math.ceil(refillCd)+"с)":"+5");r.disabled=!aiInf&&refillCd>0}}
function startBattle(){battle=true;ammo=10;refillCd=0;clearAll();$("tb").style.display="none";$("bbar").style.display="flex";
 $("bbar").innerHTML='<button id="bh">✋ Рука</button><button id="bp">P1-SUN</button><button id="bref">+5</button>';$("bh").onclick=()=>setTool("hand");$("bp").onclick=()=>setTool("p1");$("bref").onclick=refill;
 aiTimer=0;aiNext=2;hadThreats=false;setTool("p1");updBbar();notify("Бой с ИИ","Уровень: "+AIN[aiLevel]+(aiInf?", перехватчики бесконечны":"")+". Перехватывайте P1-SUN")}
function stopBattle(){if(!battle)return;battle=false;clearAll();$("tb").style.display="flex";$("bbar").style.display="none";setTool("hand")}
function placeP1(e){if(ammo<=0&&!aiInf){notify("Перехватчики закончились","Нажмите +5, чтобы пополнить");return}const p=toSvg(e.clientX,e.clientY);if(!aiInf)ammo--;
 const g=mk("g",{},$("shs"));mk("path",{d:"M9 0L-5 -4L-5 4Z",fill:"#ffffff",stroke:"#111","stroke-width":1.2},g);
 icpt.push({pos:p.slice(),g,age:0,ang:0});updBbar()}
function buildThreat(key,pts,opt){const w0=WP[key]||WP.sh,sp=opt.spd||1,w=Object.assign({},w0,{k:w0.k*sp,rk:w0.rk?w0.rk*sp:undefined});const g=mk("g",{},$("shs")),ic=mk("g",{},g);drawIcon(ic,key,opt.color||shColor);
 const tr=mk("polyline",{style:"display:none"},$("trails"));const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
 const s={pts,g,ic,tr,cum,dist:0,w,k:w.k,lv:opt.lv||"y",orig:{},trail:[],key:null,seen:new Set(),cur:null,kill:Infinity,pos:pts[0].slice(),head:Math.atan2(pts[1][1]-pts[0][1],pts[1][0]-pts[0][0])*180/Math.PI,ai:!!opt.ai};
 shs.push(s);apply();return s}
function spawnAI(spd){const keys=["sh","sh","ms","jet","jet","fpv","rec","band"];const key=keys[Math.floor(Math.random()*keys.length)];
 const from=Math.random()<.5?[1120+Math.random()*40,150+Math.random()*380]:[330+Math.random()*520,20+Math.random()*25];
 const tg=cen[Math.floor(Math.random()*O.length)];const mid=[(from[0]+tg[0])/2+(Math.random()-.5)*70,(from[1]+tg[1])/2+(Math.random()-.5)*70];
 buildThreat(key,[from,mid,tg],{ai:true,spd:spd||1,lv:Math.random()<.5?"y":"r"})}
function aiUpdate(dt){if(!battle)return;if(refillCd>0)refillCd=Math.max(0,refillCd-dt);updBbar();
 const LV_=AILV[aiLevel]||AILV.mid;aiTimer+=dt;if(aiTimer>=aiNext){aiTimer=0;aiNext=LV_.min+Math.random()*(LV_.max-LV_.min);for(let q=0;q<LV_.n;q++)spawnAI(LV_.spd)}
 const k=view.w/R().width;
 for(let i=icpt.length-1;i>=0;i--){const q=icpt[i];q.age+=dt;let best=null,bd=1e9;
  shs.forEach(s=>{if(!s.ai||s.dist>=s.kill)return;const d=Math.hypot(s.pos[0]-q.pos[0],s.pos[1]-q.pos[1]);if(d<bd){bd=d;best=s}});
  if(best){const dx=best.pos[0]-q.pos[0],dy=best.pos[1]-q.pos[1],L=Math.hypot(dx,dy)||1;q.ang=Math.atan2(dy,dx)*180/Math.PI;const st=Math.min(L,140*dt);q.pos[0]+=dx/L*st;q.pos[1]+=dy/L*st;
   if(L<9){best.kill=best.dist;fx("s",q.pos.slice());q.g.remove();icpt.splice(i,1);continue}}
  else if(q.age>25){q.g.remove();icpt.splice(i,1);continue}
  q.g.setAttribute("transform",`translate(${q.pos[0]} ${q.pos[1]}) rotate(${q.ang}) scale(${k*1.4})`)}
 const n=shs.filter(s=>s.ai&&s.dist<s.kill).length;
 if(n>0)hadThreats=true;
 if(hadThreats&&n==0){hadThreats=false;notify("Отбой тревоги","все цели уничтожены или долетели")}
}

function placeMarker(type,p){const g=mk("g",{"data-m":type},$("flags"));
 if(type=="ship"){mk("path",{d:"M-14 0L-9 6H11L14 0Z",fill:"#dfe7ef",stroke:"#111","stroke-width":1.4},g);mk("rect",{x:-6,y:-6,width:9,height:6,fill:"#dfe7ef",stroke:"#111","stroke-width":1.2},g);mk("path",{d:"M-1.5 -6V-13",stroke:"#111","stroke-width":1.2},g)}
 else{mk("circle",{r:12,fill:"#8e44ad",opacity:.55,class:"nk"},g);mk("circle",{r:4,fill:"#ffffff",stroke:"#111","stroke-width":1},g)}
 g.setAttribute("transform",`translate(${p[0]} ${p[1]}) scale(${(view.w/R().width)*1.3})`);fls.push({x:p[0],y:p[1],g});
 const nm=oblastAt(p);notify(type=="ship"?"Корабль":"Уличные бои",nm?nameOf(nm)+(nm=="kc"||nm=="cr"?"":" обл."):"море или вне суши")}
function regTap(id,type){
 if(regTag[id]){const old=regTag[id];if(old.g){const i=fls.indexOf(old);if(i>=0)fls.splice(i,1);old.g.remove()}paint(id,null);delete regTag[id];addLog("Снято",nameOf(id)+" — "+(old.type=="rad"?"радиация":"химическая угроза"));return}
 const p=S[id];const ent={type,g:null,x:p[0],y:p[1],rid:id};
 if(type=="rad"){const g=mk("g",{"data-m":"rad"},$("flags"));mk("circle",{r:11,fill:"#ffd400",stroke:"#111","stroke-width":1.4},g);mk("text",{x:0,y:4.5,"text-anchor":"middle","font-size":13,fill:"#111"},g).textContent="☢";ent.g=g;fls.push(ent);paint(id,"y");notify("Радиационная опасность",nameOf(id)+(id=="kc"||id=="cr"?"":" обл."))}
 else{paint(id,"pu");notify("Химическая угроза",nameOf(id)+(id=="kc"||id=="cr"?"":" обл."))}
 regTag[id]=ent}
function extraTap(e,el){
 const mg=el&&el.closest&&el.closest("[data-m]");
 if(mg){const f=fls.find(x=>x.g===mg);if(f&&f.rid){regTap(f.rid,f.type)}else{const i=fls.findIndex(x=>x.g===mg);if(i>=0){fls[i].g.remove();fls.splice(i,1)}}return true}
 if(tool=="ship"||tool=="street"){placeMarker(tool,toSvg(e.clientX,e.clientY));return true}
 if(tool=="rad"||tool=="chem"){const z=el&&el.closest&&el.closest("[data-id]"),id=z&&z.dataset.id;if(id)regTap(id,tool);return true}
 return false}

/* ---- build UI ---- */
function initNew(){
 const logo=document.createElement("button");logo.id="logo";logo.style.cssText="position:absolute;left:10px;top:10px;z-index:7;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;border:1px solid #ffffff22;background:var(--panel);color:var(--txt);font:600 13px system-ui,sans-serif;cursor:pointer";
 logo.innerHTML='<img src="'+LOGO+'" style="width:34px;height:34px;border-radius:50%;display:block">';
 $("map").appendChild(logo);
 const accm=document.createElement("div");accm.id="accm";accm.style.cssText="display:none;position:absolute;left:10px;top:52px;width:min(270px,80%);background:var(--panel);border:1px solid #ffffff22;border-radius:12px;padding:12px;z-index:8;box-shadow:0 6px 18px #000a;font-size:13px";$("map").appendChild(accm);
 logo.onclick=()=>{if(!prof){openReg();return}const o=accm.style.display=="none";accm.style.display=o?"block":"none";if(o)renderAcc()};
 const sch=document.createElement("div");sch.id="sch";sch.style.cssText="display:none;position:absolute;left:10px;top:52px;width:min(320px,92%);max-height:70%;overflow:auto;background:var(--panel);border:1px solid #ffffff22;border-radius:12px;padding:12px;z-index:9;box-shadow:0 6px 18px #000a;font-size:13px";
 sch.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>График света</b><button id="schx" style="font:inherit;color:var(--txt);background:none;border:0;cursor:pointer;font-size:18px">×</button></div><div style="font-size:12px;opacity:.75;margin-bottom:8px">Зелёный — свет есть, красный — света нет. Нажмите на час, чтобы поменять.</div><div id="schg" style="display:grid;grid-template-columns:repeat(6,1fr);gap:5px"></div>';
 $("map").appendChild(sch);$("schx").onclick=()=>sch.style.display="none";$("schg").onclick=e=>{const b=e.target.closest("[data-h]");if(!b)return;const h=+b.dataset.h;schedule[h]=schedule[h]?0:1;saveSched();renderSch()};
 const reg=document.createElement("div");reg.id="reg";reg.style.cssText="display:none;position:fixed;inset:0;z-index:20;background:#000c;align-items:center;justify-content:center;padding:16px";
 reg.innerHTML=`<div style="background:var(--panel);border-radius:16px;padding:16px;width:min(340px,100%);max-height:92%;overflow:auto;font-size:13px"><b style="font-size:16px">Вход</b>
 <div style="margin:12px 0 0">Ник<input id="rn" maxlength="20" style="${INP}"></div>
 <div style="margin-top:8px">Юзернейм<input id="ru" maxlength="20" placeholder="без @" style="${INP}"></div>
 <div style="margin:10px 0 4px">Аватарка</div><div id="ravs" style="display:flex;flex-wrap:wrap;gap:6px"></div>
 <input type="file" id="rimg" accept="image/*" style="margin-top:8px;width:100%;font-size:12px">
 <div style="margin:10px 0 0">Режим</div><select id="rmode" style="${INP}"><option value="edit">Редактор</option><option value="battle">Бой с ИИ</option></select>
 <button id="rgo" style="margin-top:14px;width:100%;padding:10px;border-radius:10px;border:0;background:#4c8dff;color:#fff;font:600 14px system-ui,sans-serif;cursor:pointer">Войти</button></div>`;
 $("map").appendChild(reg);
 $("ravs").onclick=e=>{const lg=e.target.closest("[data-logo]");if(lg){regImg=LOGO;renderRav();return}const b=e.target.closest("[data-a]");if(!b)return;regAv=b.dataset.a;regImg=null;renderRav()};
 $("rimg").onchange=e=>{const f=e.target.files[0];if(!f)return;shrinkImg(f,d=>{regImg=d;renderRav()})};
 $("rgo").onclick=finishLogin;
 applyWinter();
 if(prof&&prof.ai){aiLevel=prof.ai.level||"mid";aiInf=!!prof.ai.inf}
 if(!prof){openReg()}else{renderAcc();if(prof.winter){winter=true;applyWinter()}applyMode(prof.mode||"edit")}
}
initNew();

</script></body></html>
